syntax = "proto3";

option java_multiple_files = true;
option java_package = "doctor_service";
option java_outer_classname = "DoctorServiceProto";

service DoctorService{
  rpc ValidateDoctorBooking (ValidateDoctorBookingRequest) returns (ValidateDoctorBookingResponse);
}

message ValidateDoctorBookingRequest{
  string doctor_id =1;
  int32 specialty_id = 2;
  string date_time = 3;

}

message ValidateDoctorBookingResponse{
  string doctor_full_name = 1;
  string specialty_name = 2;
  string appointment_price = 3;
  int32 appointment_duration = 4;
  string doctor_email = 5;

}