syntax = "proto3";

option java_multiple_files = true;
option java_package = "patient_service";
option java_outer_classname = "PatientServiceProto";

service PatientService{
  rpc ValidatePatient(ValidatePatientRequest) returns (ValidatePatientResponse);
}

message ValidatePatientRequest{
  string patient_id =1;
}

message ValidatePatientResponse{
  string patient_id =1;
  string full_name =2;
  string personal_id = 3;
  string patient_email = 4;

}

