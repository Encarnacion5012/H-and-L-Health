databaseChangeLog:
  - changeSet:
      id: 002
      author: estainlin
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createIndex:
            indexName: idx_users_email
            tableName: users
            unique: true
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_users_username
            tableName: users
            unique: true
            columns:
              - column:
                  name: username
        - createIndex:
            indexName: idx_roles_role_name
            tableName: roles
            unique: true
            columns:
              - column:
                  name: role_name


